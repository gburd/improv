[package]
name = "improv_verified"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Improv's machine-checked integer kernels (Verus specs and proofs; plain Rust under cargo)"

[dependencies]
vstd.workspace = true

# `cargo-verus verify -p improv_verified` checks the proofs; plain cargo erases
# the specs and builds ordinary Rust.
[package.metadata.verus]
verify = true

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
