[package]
name = "improv_pg_model"
description = "Postgres-free core of the pg_improv extension: catalog -> Model, bound rows -> cells, results -> SQL"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "improv_pg_model"
path = "src/lib.rs"

[dependencies]
improv_core_model = { path = "../core_model" }
improv_data_source = { path = "../data_source" }
improv_engine = { path = "../engine" }
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
