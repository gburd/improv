[package]
name = "improv_client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What every Improv front end shares without the engine or a store: located formula errors, autocomplete, function help and the formula printer. Builds for wasm32-unknown-unknown."

[dependencies]
improv_core_model = { path = "../core_model" }

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
