[package]
name = "improv_storage_csv"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "improv_storage_csv"
path = "src/lib.rs"

[dependencies]
improv_core_model = { path = "../core_model" }
improv_data_source = { path = "../data_source" }
# Exporting a DERIVED measure needs computed cells, which only the engine can
# produce. No cycle: the engine depends on core_model/extfn, never on storage.
improv_engine = { path = "../engine" }
thiserror.workspace = true
csv = "1"

[dev-dependencies]
chrono.workspace = true

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
