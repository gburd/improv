[package]
name = "improv_server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "improv-server"
path = "src/main.rs"

[dependencies]
improv_core_model = { path = "../core_model" }
improv_storage_mentat = { path = "../storage_mentat" }
improv_engine = { path = "../engine" }
improv_nl_formula = { path = "../nl_formula" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true, features = ["limit", "timeout", "util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
sha2 = "0.11"

[dev-dependencies]
improv_extfn = { path = "../extfn" }
tokio = { workspace = true, features = ["io-util"] }
