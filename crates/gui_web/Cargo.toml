[package]
name = "improv_gui_web"
version = "0.10.0"
edition = "2021"
rust-version = "1.97"
license = "(MIT OR Apache-2.0) AND OFL-1.1"
publish = false
description = "Spike (road-to-1.0 I1): the NeXTSTEP worksheet in a browser, over improv-server"

# Its own workspace, so the root build, its Cargo.lock and CI never see this
# crate. Build it for wasm32-unknown-unknown only: see README.md.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
improv_core_model = { path = "../core_model" }
# Only with `--features probe`: does the engine run in the browser?
improv_engine = { path = "../engine", optional = true }
egui = "=0.29"
eframe = { version = "=0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must equal the wasm-bindgen CLI that generates the JS glue.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Headers",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }

[features]
probe = ["dep:improv_engine"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
