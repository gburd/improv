[package]
name = "improv_gui_web"
version.workspace = true
edition.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1"
publish = false
description = "The Improv GUI in a browser: egui over improv-server's /v1 API."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
accesskit.workspace = true
improv_client = { path = "../client" }
improv_core_model = { path = "../core_model" }
serde.workspace = true
serde_json.workspace = true

# The app is browser-only; on other targets the crate is its pure parts
# (the grid layout, tested natively), so the workspace builds everywhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui.workspace = true
# The web runner with glow (WebGL); none of the desktop features.
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
# Must equal the wasm-bindgen CLI that writes the JS glue (build.sh).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CharacterData",
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "FocusOptions",
    "Headers",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCache",
    "RequestInit",
    "Response",
    "Text",
    "Window",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
