[package]
name = "improv_duckdb_model"
description = "DuckDB-free core of the improv DuckDB extension: model spec, rows -> cells, results -> rows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "improv_duckdb_model"
path = "src/lib.rs"

[dependencies]
improv_core_model = { path = "../core_model" }
improv_engine = { path = "../engine" }
improv_pg_model = { path = "../pg_model" }
serde_json.workspace = true
thiserror.workspace = true

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
