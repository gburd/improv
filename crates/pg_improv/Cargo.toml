[package]
name = "pg_improv"
description = "Postgres extension: Improv multidimensional models over Postgres data"
version = "0.13.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
authors = ["Greg Burd <greg@burd.me>"]
publish = false

# A standalone workspace (and Cargo.lock): pgrx-pg-sys needs pg_config and
# libclang at build time, so this crate must not ride in the root workspace's
# `cargo test --workspace`. It is listed in the root's `exclude`.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.3"
improv_core_model = { path = "../core_model" }
improv_engine = { path = "../engine" }
improv_nl_formula = { path = "../nl_formula" }
improv_pg_model = { path = "../pg_model" }
improv_policy = { path = "../policy" }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
pgrx-tests = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
