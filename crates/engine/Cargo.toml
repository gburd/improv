[package]
name = "improv_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "improv_engine"
path = "src/lib.rs"

[dependencies]
improv_core_model = { path = "../core_model" }
improv_extfn = { path = "../extfn" }
# Machine-checked integer kernels (Verus proofs; plain Rust here).
improv_verified = { path = "../verified" }
thiserror.workspace = true
serde.workspace = true
chrono.workspace = true
regex = "1.13"
statrs = { version = "0.19", default-features = false, features = ["std"] }
# Already in the graph through statrs (num-traits): musl's erf, erfc, tgamma and
# lgamma, accurate to about an ulp (statrs's erf is good to ~1e-11).
libm = "0.2"
differential-dataflow.workspace = true
timely.workspace = true
smallvec = { version = "1.13", features = ["union", "const_generics", "serde"] }

[dev-dependencies]
serde_json.workspace = true
proptest = "1"
hegeltest.workspace = true

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
