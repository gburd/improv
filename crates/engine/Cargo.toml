[package]
name = "improv_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "improv_engine"
path = "src/lib.rs"

[dependencies]
improv_core_model = { path = "../core_model" }
improv_extfn = { path = "../extfn" }
thiserror.workspace = true
serde.workspace = true
chrono.workspace = true
regex = "1.13"
differential-dataflow.workspace = true
timely.workspace = true

[dev-dependencies]
serde_json.workspace = true
proptest = "1"

# `cargo llvm-cov` on nightly sets `--cfg coverage_nightly`; test modules are
# `coverage(off)` so the report measures library code only.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
