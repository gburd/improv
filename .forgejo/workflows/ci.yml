# Forgejo / Codeberg CI — mirrors .github/workflows/ci.yml.
# Forgejo Actions syntax is nearly identical to GitHub Actions.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings
  MENTAT_REPO: https://codeberg.org/gregburd/mentat.git
  MENTAT_REF: improv-base

jobs:
  lint-build-test:
    name: lint + build + test
    runs-on: docker
    container:
      image: rust:1.97-bookworm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: improv
      - name: Clone Mentat backend
        run: git clone --depth 1 --branch "$MENTAT_REF" "$MENTAT_REPO" mentat
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Format
        working-directory: improv
        run: >
          cargo fmt
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_extfn
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          -- --check
      - name: Clippy (workspace crates)
        working-directory: improv
        run: >
          cargo clippy
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_extfn
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          --all-targets --all-features -- -D warnings
      - name: Build
        working-directory: improv
        run: cargo build --workspace --all-features
      - name: Test
        working-directory: improv
        run: cargo test --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: docker
    container:
      image: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          path: improv
      - name: Clone Mentat backend
        run: git clone --depth 1 --branch "$MENTAT_REF" "$MENTAT_REPO" mentat
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny
        working-directory: improv
        run: cargo deny check advisories licenses bans sources
