# Forgejo / Codeberg CI — mirrors .github/workflows/ci.yml.
# Forgejo Actions syntax is nearly identical to GitHub Actions.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  lint-build-test:
    name: lint + build + test
    runs-on: docker
    container:
      image: rust:1.97-bookworm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: improv
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Format
        working-directory: improv
        run: >
          cargo fmt
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_extfn
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          -- --check
      - name: Clippy (workspace crates)
        working-directory: improv
        run: >
          cargo clippy
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_extfn
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          --all-targets --all-features -- -D warnings
      - name: Build
        working-directory: improv
        run: cargo build --workspace --all-features
      - name: Test
        working-directory: improv
        run: cargo test --workspace --all-features

  # Review plan D5; mirrors the GitHub gui-shot job.
  gui-shot:
    name: GUI screenshot vs golden
    runs-on: docker
    container:
      image: rust:1.97-trixie
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: improv
      - name: Install Xvfb, ImageMagick, xdotool, GL/X11 runtime
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          xvfb x11-apps imagemagick xdotool
          libgl1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0
          libxcursor1 libxi6 libxrandr2
      - name: Screenshot regression
        working-directory: improv
        run: scripts/gui-shot-check.sh
      - name: Upload capture and diff
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gui-shot
          path: improv/target/gui-shot/

  # Coverage gate (see .github/workflows/ci.yml for the rationale).
  coverage:
    runs-on: docker
    container:
      image: rust:1.97-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: improv
      - name: Install nightly + llvm-cov, bubblewrap, python3, postgres
        run: |
          apt-get update && apt-get install -y --no-install-recommends bubblewrap python3 postgresql
          rustup toolchain install nightly --profile minimal -c llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          service postgresql start
          su postgres -c "psql -c \"CREATE ROLE improv LOGIN PASSWORD improv\" -c \"CREATE DATABASE improv_test OWNER improv\""
      - name: Coverage gate
        working-directory: improv
        env:
          IMPROV_TEST_PG: "host=127.0.0.1 user=improv password=improv dbname=improv_test"
        run: scripts/coverage.sh 90

  deny:
    name: cargo-deny
    runs-on: docker
    container:
      image: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          path: improv
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny
        working-directory: improv
        run: cargo deny check advisories licenses bans sources
