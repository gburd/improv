# Android targets only.  Covers arm64-v8a (phones and Googlebooks) and
# x86_64 (emulators and Intel Googlebooks).  Google Play requires shared
# libraries to be 16 KB page-aligned; NDK r27+ defaults to this, but we set
# it explicitly so the requirement holds even if an older NDK is used, and we
# use a reproducible SHA-1 build id.
[target.'cfg(target_os = "android")']
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
    "-C", "link-arg=-Wl,--build-id=sha1",
]
