# actionlint config (`actionlint` finds it here). The Forgejo workflows run on
# Codeberg runners: `docker` is their runner label, and Forgejo artifact
# storage speaks the v3 upload-artifact protocol, not v4.
self-hosted-runner:
  labels: [docker]
paths:
  .forgejo/workflows/*.yml:
    ignore:
      - "the runner of \"actions/upload-artifact@v3\" action is too old"
