name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook toolchain
        run: |
          # Pinned as a set: mdbook-linkcheck has no mdbook 0.5 release, and
          # mdbook-mermaid >= 0.17 targets mdbook 0.5 (the preprocessor
          # protocol changed), so all three stay on the 0.4 line.
          cargo install mdbook --version =0.4.52 --locked
          cargo install mdbook-linkcheck --version =0.7.7 --locked
          cargo install mdbook-mermaid --version =0.16.2 --locked
      - name: Build mdBook guide
        working-directory: improv
        run: mdbook build docs
      - name: Build rustdoc API
        working-directory: improv
        run: cargo doc --workspace --no-deps
      - name: Assemble site
        working-directory: improv
        run: |
          site="$GITHUB_WORKSPACE/site"
          mkdir -p "$site"
          # mdbook-linkcheck nests html output under docs/book/html.
          if [ -d docs/book/html ]; then
            cp -r docs/book/html/* "$site"/
          else
            cp -r docs/book/* "$site"/
          fi
          mkdir -p "$site/api"
          cp -r target/doc/* "$site/api"/
          # rustdoc writes one directory per crate and no /api/ landing page.
          {
            echo '<!doctype html><meta charset="utf-8"><title>Improv API reference</title>'
            echo '<h1>Improv API reference (rustdoc)</h1><ul>'
            for d in "$site"/api/improv_*/; do
              c=$(basename "$d")
              echo "<li><a href=\"$c/index.html\">$c</a></li>"
            done
            echo '</ul><p><a href="../">The Improv guide</a></p>'
          } > "$site/api/index.html"
          test -s "$site/api/index.html"
          # Landing redirect to the guide.
          printf '<meta http-equiv="refresh" content="0; url=./index.html">' > "$site/404.html"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
