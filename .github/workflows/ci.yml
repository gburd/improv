name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Format only the Improv workspace crates: `cargo fmt --all` would also
      # walk the vendored Mentat path dependency (and, transitively, whatever
      # IT path-depends on) if it happens to be checked out alongside this
      # repo, which is not part of our gate.
      - run: >
          cargo fmt
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_extfn
          -p improv_pg_model
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
      # Lint only the Improv workspace crates; the vendored Mentat dep emits its
      # own (upstream) warnings which must not fail our -D warnings gate.
      - name: Clippy (workspace crates)
        working-directory: improv
        run: >
          cargo clippy
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_extfn
          -p improv_pg_model
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          --all-targets --all-features -- -D warnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: crate-ci/typos@db35ee91e80fbb447f33b0e5fbddb24d2a1a884f # v1.29.4

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          manifest-path: improv/Cargo.toml
          command: check advisories licenses bans sources

  build-test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@d31232495ad76f47aad66e3501e47780b49f0f3e # nextest
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: ${{ matrix.os }}-${{ matrix.features }}
      - name: Build
        working-directory: improv
        run: cargo build --workspace ${{ matrix.features }}
      - name: Test
        working-directory: improv
        run: cargo nextest run --workspace ${{ matrix.features }}
      - name: Doctests
        working-directory: improv
        run: cargo test --workspace --doc ${{ matrix.features }}

  # Coverage gate: every crate >= 90% functions AND >= 90% branches (inline
  # test modules excluded; see CONTRIBUTING.md "Coverage"). Branch coverage
  # needs nightly; bubblewrap + python3 so the sandboxed extfn paths run, and
  # a Postgres service so storage_sql/pg.rs runs live.
  coverage:
    name: Coverage (>= 90% fn and branch per crate)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: improv
          POSTGRES_PASSWORD: improv
          POSTGRES_DB: improv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U improv" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      IMPROV_TEST_PG: "host=127.0.0.1 user=improv password=improv dbname=improv_test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Install bubblewrap and python3
        # ubuntu-24.04 restricts unprivileged user namespaces (AppArmor), which
        # bwrap needs; lift it so the sandboxed extfn paths run, not fail.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@d31232495ad76f47aad66e3501e47780b49f0f3e # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: coverage
      - name: Coverage gate
        working-directory: improv
        run: scripts/coverage.sh --html 90
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: improv/target/coverage-html/
          if-no-files-found: ignore

  # pg_improv: the Postgres extension (its own Cargo workspace; pgrx needs
  # pg_config + libclang). Runs the #[pg_test] suite on PG 17 with the sync
  # worker preloaded, then the end-to-end logical-decoding script.
  pg_improv:
    name: pg_improv (pgrx, PG 17)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 60
    container:
      image: rust:1.97-trixie
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Install Postgres 17 + build deps
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          postgresql-17 postgresql-server-dev-17 libclang-dev clang sudo
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv/crates/pg_improv
          key: pg_improv
      - name: cargo-pgrx
        run: |
          rustup component add rustfmt clippy
          cargo install cargo-pgrx --version 0.17.0 --locked
          chmod -R a+w /usr/share/postgresql/17/extension /usr/lib/postgresql/17/lib
          useradd -m pgi && chown -R pgi improv "$CARGO_HOME"
          sudo -u pgi env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" cargo pgrx init --pg17 /usr/lib/postgresql/17/bin/pg_config
      - name: fmt + clippy
        working-directory: improv/crates/pg_improv
        run: |
          cargo fmt --check
          sudo -u pgi env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" cargo clippy --features pg17 --all-targets -- -D warnings
      - name: pg_test
        working-directory: improv/crates/pg_improv
        run: sudo -u pgi env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" cargo pgrx test pg17
      - name: logical decoding end to end
        working-directory: improv/crates/pg_improv
        run: |
          sudo -u pgi env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" cargo pgrx install --release --pg-config /usr/lib/postgresql/17/bin/pg_config
          sudo -u pgi env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" N_SINGLE=10 N_BULK=3 ./tests/logical.sh

  # Review plan D5: the GUI rendered headless (Xvfb + llvmpipe) must match the
  # committed golden. Debian 13 like the box that made the golden, so Mesa and
  # ImageMagick match. Refresh: CONTRIBUTING.md "GUI screenshot golden".
  gui-shot:
    name: GUI screenshot vs golden
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 30
    container:
      image: rust:1.97-trixie
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Install Xvfb, ImageMagick, xdotool, GL/X11 runtime
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          xvfb x11-apps imagemagick xdotool
          libgl1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0
          libxcursor1 libxi6 libxrandr2
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: gui-shot
      - name: Screenshot regression
        working-directory: improv
        run: scripts/gui-shot-check.sh
      - name: Upload capture and diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-shot
          path: improv/target/gui-shot/
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - name: Build (MSRV)
        working-directory: improv
        run: cargo build --workspace

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
      - name: rustdoc
        working-directory: improv
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps
      - name: Install mdBook
        run: |
          cargo install mdbook --version ^0.4 --locked || true
          cargo install mdbook-linkcheck --locked || true
          cargo install mdbook-mermaid --locked || true
      - name: Build book
        working-directory: improv
        run: mdbook build docs
