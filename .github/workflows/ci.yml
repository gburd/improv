name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Format only the Improv workspace crates: `cargo fmt --all` would also
      # walk the vendored Mentat path dependency (and, transitively, whatever
      # IT path-depends on) if it happens to be checked out alongside this
      # repo, which is not part of our gate.
      - run: >
          cargo fmt
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_verified
          -p improv_extfn
          -p improv_pg_model
          -p improv_duckdb_model
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
      # Lint only the Improv workspace crates; the vendored Mentat dep emits its
      # own (upstream) warnings which must not fail our -D warnings gate.
      - name: Clippy (workspace crates)
        working-directory: improv
        run: >
          cargo clippy
          -p improv_core_model
          -p improv_storage_mentat
          -p improv_storage_sql
          -p improv_storage_csv
          -p improv_engine
          -p improv_verified
          -p improv_extfn
          -p improv_pg_model
          -p improv_duckdb_model
          -p improv_nl_formula
          -p improv_cli
          -p improv_tui
          -p improv_server
          -p improv_gui
          --all-targets --all-features -- -D warnings

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: crate-ci/typos@db35ee91e80fbb447f33b0e5fbddb24d2a1a884f # v1.29.4

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          manifest-path: improv/Cargo.toml
          command: check advisories licenses bans sources

  build-test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    # A cold cache compiles the bundled DuckDB C++ (several minutes on a
    # 3-4 core runner, longest on Windows/MSVC) before any test runs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "--all-features"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@d31232495ad76f47aad66e3501e47780b49f0f3e # nextest
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: ${{ matrix.os }}-${{ matrix.features }}
      - name: Build
        working-directory: improv
        run: cargo build --workspace ${{ matrix.features }}
      - name: Test
        working-directory: improv
        run: cargo nextest run --workspace ${{ matrix.features }}
      - name: Doctests
        working-directory: improv
        run: cargo test --workspace --doc ${{ matrix.features }}

  # Coverage gate: every crate >= 90% functions AND >= 90% branches (inline
  # test modules excluded; see CONTRIBUTING.md "Coverage"). Branch coverage
  # needs nightly; bubblewrap + python3 so the sandboxed extfn paths run, and
  # a Postgres service so storage_sql/pg.rs runs live.
  coverage:
    name: Coverage (>= 90% fn and branch per crate)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: improv
          POSTGRES_PASSWORD: improv
          POSTGRES_DB: improv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U improv" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      IMPROV_TEST_PG: "host=127.0.0.1 user=improv password=improv dbname=improv_test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Install bubblewrap and python3
        # ubuntu-24.04 restricts unprivileged user namespaces (AppArmor), which
        # bwrap needs; lift it so the sandboxed extfn paths run, not fail.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      # Pinned: the install-action's default (0.6.x) cannot read current
      # nightly's profiles; its report silently drops files and functions.
      - uses: taiki-e/install-action@d31232495ad76f47aad66e3501e47780b49f0f3e # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: coverage
      - name: Coverage gate
        working-directory: improv
        run: scripts/coverage.sh --html 90
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: improv/target/coverage-html/
          if-no-files-found: ignore

  # pg_improv: the Postgres extension (its own Cargo workspace; pgrx needs
  # pg_config + libclang). Runs the #[pg_test] suite on PG 17 with the sync
  # worker preloaded, then the end-to-end logical-decoding script.
  pg_improv:
    name: pg_improv (pgrx, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    container:
      image: rust:1.97-trixie
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
          # tests/upgrade.sh builds each earlier release from its tag.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv/crates/pg_improv
          key: pg_improv-${{ matrix.pg }}
      # One script for GitHub, Forgejo and a local run: fmt, clippy, pg_test,
      # pgspot, tests/txn.sh, tests/logical.sh; on 17 also tests/upgrade.sh
      # and the PGXN dist build.
      - name: pg_improv on PG ${{ matrix.pg }}
        run: improv/ci/pg_improv.sh ${{ matrix.pg }}

  # The DuckDB extension (crates/duckdb_improv: its own Cargo workspace).
  # One release binary must load into BOTH the DuckDB v1.5.6 floor and the
  # v2.0 alpha the community registry builds against (README "Pins").
  # ci/duckdb_improv.sh: fmt, clippy, the SQLLogicTest file under Python
  # duckdb 1.5.6 and 2.0, smoke.sh under the v1.5.6 and v2.0.0-alpha46057
  # CLIs, the concurrency test, and improv(...) against `improv eval`.
  test-duckdb:
    name: DuckDB extension (v1.5.6 + v2.0)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
          submodules: recursive   # crates/duckdb_improv/extension-ci-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            improv/crates/duckdb_improv
            improv
          key: duckdb
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv ninja-build cmake unzip
      # The v2.0 alpha has no CLI download: ci/duckdb-clis.sh builds it from
      # source at its commit (about 15 minutes cold), so cache it by commit.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: duckdb-cli
          key: duckdb-cli-v1.5.6-b15358c371-${{ runner.os }}
      - name: duckdb_improv
        run: improv/ci/duckdb_improv.sh "$GITHUB_WORKSPACE/duckdb-cli"

  # Review plan D5: the GUI rendered headless (Xvfb + llvmpipe) must match the
  # committed golden. Debian 13 like the box that made the golden, so Mesa and
  # ImageMagick match. Refresh: CONTRIBUTING.md "GUI screenshot golden".
  gui-shot:
    name: GUI screenshot vs golden
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    timeout-minutes: 30
    container:
      image: rust:1.97-trixie
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Install Xvfb, ImageMagick, xdotool, GL/X11 runtime
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          xvfb x11-apps imagemagick xdotool
          libgl1 libegl1 libgl1-mesa-dri libxkbcommon-x11-0
          libxcursor1 libxi6 libxrandr2
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: gui-shot
      - name: Screenshot regression
        working-directory: improv
        run: scripts/gui-shot-check.sh
      - name: Upload capture and diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-shot
          path: improv/target/gui-shot/
          if-no-files-found: ignore

  # The Verus proofs of crates/verified (scripts/verify.sh). The release and
  # its Rust toolchain are pinned together; vstd in Cargo.toml must match.
  verify:
    name: Verus proofs
    runs-on: ubuntu-latest
    needs: [fmt]
    env:
      VERUS_RELEASE: 0.2026.10.04.426d8b0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Install Verus
        run: |
          zip="verus-${VERUS_RELEASE}-x86-linux.zip"
          curl -fsSL -o "$zip" "https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/${zip}"
          unzip -q "$zip"
          echo "VERUS_DIR=$PWD/verus-x86-linux" >> "$GITHUB_ENV"
      - name: Verify
        working-directory: improv
        run: scripts/verify.sh

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - name: Build (MSRV)
        working-directory: improv
        run: cargo build --workspace

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
      - name: rustdoc
        working-directory: improv
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps
      - name: Install mdBook
        run: |
          # Pinned as a set: mdbook-linkcheck has no mdbook 0.5 release, and
          # mdbook-mermaid >= 0.17 targets mdbook 0.5 (the preprocessor
          # protocol changed), so all three stay on the 0.4 line.
          cargo install mdbook --version =0.4.52 --locked
          cargo install mdbook-linkcheck --version =0.7.7 --locked
          cargo install mdbook-mermaid --version =0.16.2 --locked
      - name: Build book
        working-directory: improv
        run: mdbook build docs
