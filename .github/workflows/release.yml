name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MENTAT_REPO: https://codeberg.org/gregburd/mentat.git
  MENTAT_REF: improv-base

jobs:
  qualify:
    name: Qualify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Clone Mentat backend
        run: git clone --depth 1 --branch "$MENTAT_REF" "$MENTAT_REPO" mentat
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: release-${{ matrix.target }}
      - name: Test (release)
        working-directory: improv
        run: cargo test --workspace --release
      - name: Build CLI (release)
        working-directory: improv
        run: cargo build --release --target ${{ matrix.target }} -p improv_cli
      - name: Package
        working-directory: improv
        shell: bash
        run: |
          bin=improv
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          staging="improv-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${bin}${ext}" "$staging/"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          cp docs/man/improv.1 "$staging/" 2>/dev/null || true
          if [ "$ext" = ".exe" ]; then
            7z a "${staging}.zip" "$staging"
            echo "ASSET=improv/${staging}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${staging}.tar.gz" "$staging"
            echo "ASSET=improv/${staging}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
