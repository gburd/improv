name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Qualify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Intel macOS runners are gone (macos-13 retired): cross-compile on
          # the arm64 runner; its tests run only for the native target above.
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: improv
          key: release-${{ matrix.target }}
      - name: Test (release)
        if: matrix.test
        working-directory: improv
        run: cargo test --workspace --release --target ${{ matrix.target }}
      - name: Build binaries (release)
        working-directory: improv
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p improv_cli -p improv_tui -p improv_server -p improv_gui
      - name: Package
        working-directory: improv
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext=""
          case "$TARGET" in *windows*) ext=".exe" ;; esac
          staging="improv-${REF_NAME}-${TARGET}"
          mkdir -p "$staging/man"
          for bin in improv improv-tui improv-server improv-gui; do
            cp "target/$TARGET/release/${bin}${ext}" "$staging/"
          done
          cp docs/man/*.1 "$staging/man/"
          cp README.md LICENSE-APACHE LICENSE-MIT CHANGELOG.md "$staging/"
          mkdir -p dist
          if [ -n "$ext" ]; then
            7z a "dist/${staging}.zip" "$staging"
          else
            tar czf "dist/${staging}.tar.gz" "$staging"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: improv/dist/*
          if-no-files-found: error

  # The extension, per Postgres major: `cargo pgrx package` against that
  # major's PGDG build (its own pg_config, not whatever is on PATH), as
  # pg_improv-<ver>-pg<N>-x86_64-linux.tar.gz: the .so, control file,
  # install script and update scripts laid out under usr/.
  extension:
    name: Extension (PG ${{ matrix.pg }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    container:
      image: rust:1.97-trixie
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: improv
      - name: Package
        env:
          PG: ${{ matrix.pg }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-common ca-certificates
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          apt-get install -y -qq --no-install-recommends "postgresql-server-dev-$PG" libclang-dev clang
          cargo install cargo-pgrx --version 0.17.0 --locked
          cd improv/crates/pg_improv
          cargo pgrx init "--pg$PG" "/usr/lib/postgresql/$PG/bin/pg_config"
          ver="${REF_NAME#v}"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$ver"
          cargo pgrx package --no-default-features --features "pg$PG" \
            --pg-config "/usr/lib/postgresql/$PG/bin/pg_config" --out-dir "$PWD/pkg"
          test -n "$(find pkg -name 'pg_improv*.so' -o -name 'pg_improv*.dylib' | head -1)"
          test -f "$(find pkg -name "pg_improv--$ver.sql" | head -1)"
          mkdir -p ../../dist
          tar czf "../../dist/pg_improv-$ver-pg$PG-x86_64-linux.tar.gz" -C pkg .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-pg${{ matrix.pg }}
          path: improv/dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qualify, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The `## [X.Y.Z] - date` section for this tag, up to the next one.
          awk -v h="## [${REF_NAME#v}]" \
            'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "CHANGELOG.md has no '## [${REF_NAME#v}]' section" >&2
            exit 1
          }
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  # PGXN: the source distribution (ci/pgxn-dist.sh), uploaded with the
  # official pgxn-tools. Skipped (not failed) until PGXN_USERNAME and
  # PGXN_PASSWORD are set as repository secrets.
  pgxn:
    name: Publish to PGXN
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: pgxn/pgxn-tools
    steps:
      - name: Skip if PGXN secrets are not configured
        id: check
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: |
          if [ -z "$PGXN_USERNAME" ] || [ -z "$PGXN_PASSWORD" ]; then
            echo "::notice::PGXN_USERNAME/PGXN_PASSWORD not set; skipping the PGXN release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.check.outputs.skip != 'true'
        with:
          persist-credentials: false
      - name: Build the dist (Rust, cargo-pgrx, PG 17)
        if: steps.check.outputs.skip != 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          pg-start 17
          apt-get install -y -qq --no-install-recommends libclang-dev clang curl zip python3
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain 1.97.1
          . "$HOME/.cargo/env"
          cargo install cargo-pgrx --version 0.17.0 --locked
          cargo pgrx init --pg17 "$(command -v pg_config)"
          ci/pgxn-dist.sh pg17
          test "$(python3 -c 'import json; print(json.load(open("META.json"))["version"])')" = "${REF_NAME#v}"
      - name: Release on PGXN
        if: steps.check.outputs.skip != 'true'
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: pgxn-release pg_improv-*.zip

  # postgresql.org news (which feeds pgsql-announce): feature and major
  # releases only. ci/announce.sh skips a patch release unless its CHANGELOG
  # section has a "### Security" heading (or ANNOUNCE=1), and with the
  # PGORG_* secrets unset it prints the draft to paste in by hand. Either
  # way the article waits for postgresql.org's two moderators.
  announce:
    name: Announce (postgresql.org news)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release, pgxn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Announce
        env:
          REF_NAME: ${{ github.ref_name }}
          PGORG_USER: ${{ secrets.PGORG_USER }}
          PGORG_PASSWORD: ${{ secrets.PGORG_PASSWORD }}
          PGORG_ORG_ID: ${{ secrets.PGORG_ORG_ID }}
          PGORG_EMAIL_ID: ${{ secrets.PGORG_EMAIL_ID }}
          PGORG_TAGS: ${{ secrets.PGORG_TAGS }}
        run: bash ci/announce.sh "${REF_NAME#v}"
