name: DuckDB extension

# Qualify the `improv` DuckDB extension on every platform the DuckDB
# Community Extensions registry builds, with the registry's own reusable
# workflow and the same inputs its build.yml passes for our descriptor
# (crates/duckdb_improv/community-extensions/description.yml). A green run
# on a commit is what lets that commit be the descriptor's `repo.ref`.
#
# The registry tests only on macOS arm64 and Windows amd64 (linux_amd64 and
# linux_arm64 skip tests), and its test venv is DuckDB 1.5.6. So
# `cross-version` then loads the linux_amd64 artifact it built into the
# DuckDB v1.5.6 and v2.0.0 CLIs: one binary, both versions
# (crates/duckdb_improv/README.md, "Pins").
#
# Run by hand on any branch of the GitHub mirror:
#   gh workflow run duckdb.yml -R gburd/improv --ref <branch>

on:
  push:
    branches: [main]
    paths:
      - crates/duckdb_improv/**
      - crates/duckdb_model/**
      - Makefile
      - .github/workflows/duckdb.yml
      - ci/duckdb-clis.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckdb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The registry's build.yml (duckdb/community-extensions 6c3738b8): DuckDB
  # v2.0.0 (duckdb_commit d54cbbe3), ci-tools v2.0-cyanoptera. Keep these in
  # step with it, and exclude_archs with the descriptor's excluded_platforms.
  build:
    name: Registry build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@8f59772b4ef9a13837b3e353db032b3aca300d04 # v2.0-cyanoptera
    with:
      extension_name: improv
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extra_toolchains: rust;python3
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl
      # Build every platform even on a PR-like event: this is qualification.
      reduced_ci_mode: disabled

  cross-version:
    name: linux_amd64 artifact in DuckDB v1.5.6 and v2.0
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: improv-v2.0.0-extension-linux_amd64
          path: artifact
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip
      - name: DuckDB CLIs
        run: ci/duckdb-clis.sh "$GITHUB_WORKSPACE/duckdb-cli"
      - name: smoke.sh in both
        run: |
          ext="$(find artifact -name improv.duckdb_extension | head -1)"
          test -n "$ext"
          tail -c 600 "$ext" | strings | grep -qx C_STRUCT   # the stable ABI, not C_STRUCT_UNSTABLE
          for v in v1.5.6 v2.0.0; do
            EXT="$PWD/$ext" DUCKDB="$GITHUB_WORKSPACE/duckdb-cli/$v/duckdb" \
              bash crates/duckdb_improv/test/smoke.sh
          done
