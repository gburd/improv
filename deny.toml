# cargo-deny configuration.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The embedded Mentat crates (mentatdb on crates.io) pull a few
    # unmaintained transitive crates and is tracked in the mentat repo, not
    # here. Improv's own crates introduce none of these.
    "RUSTSEC-2025-0141", # bincode unmaintained (transitive via mentat)
    "RUSTSEC-2024-0436", # paste no longer maintained (differential-dataflow)
    # Unmaintained (folded into zbus 6.0): the zbus D-Bus types, pulled in by
    # egui's Linux accessibility bridge (accesskit_unix -> zbus 5 in egui
    # 0.37). No zbus 5 release replaces them; revisit with the next egui.
    "RUSTSEC-2026-0370", # zvariant unmaintained
    "RUSTSEC-2026-0371", # zbus_names unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (Mozilla CA bundle data) via the duckdb bundled build's
    # ureq/httpfs chain; permissive, build-time only. DuckDB is a supported
    # backend, so we allow it rather than drop the feature.
    "CDLA-Permissive-2.0",
    # Font licenses from egui's bundled default fonts (permissive, OSI-recognized).
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    # egui 0.37 declares its bundled Ubuntu-Light font under the Ubuntu Font
    # Licence (epaint_default_fonts); permissive, as UFL-1.0 above.
    "Ubuntu-font-1.0",
]
unused-allowed-license = "allow"

[bans]
# The DD/timely pin and the vendored Mentat workspace drag in multiple versions
# and wildcard path deps transitively. Improv's own crates use pinned versions.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
