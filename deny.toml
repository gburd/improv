# cargo-deny configuration.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The vendored embedded Mentat workspace (path dep) pulls a few
    # unmaintained transitive crates and is tracked in the mentat repo, not
    # here. Improv's own crates introduce none of these.
    "RUSTSEC-2025-0141", # bincode unmaintained (transitive via mentat)
    "RUSTSEC-2024-0436", # paste no longer maintained (differential-dataflow)
    # Transitive via the egui/eframe GUI stack (fonts + xml). Not on any hot
    # path we control; revisit when egui updates the offending deps.
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (egui font rasterizer)
    "RUSTSEC-2026-0194", # quick-xml quadratic tag scan (egui svg/icon path)
    "RUSTSEC-2026-0195", # quick-xml NsReader alloc DoS (egui svg/icon path)
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (Mozilla CA bundle data) via the duckdb bundled build's
    # ureq/httpfs chain; permissive, build-time only. DuckDB is a supported
    # backend, so we allow it rather than drop the feature.
    "CDLA-Permissive-2.0",
    # Font licenses from egui's bundled default fonts (permissive, OSI-recognized).
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
unused-allowed-license = "allow"

# The vendored Mentat workspace crates omit their license field; the whole
# workspace is Apache-2.0. Clarify each so cargo-deny doesn't flag them.
[[licenses.clarify]]
crate = "sql_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_transaction"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "public_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "query_algebrizer_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "query_projector_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "query_pull_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "core_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "db_traits"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_core"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_db"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_query_algebrizer"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_query_projector"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_query_pull"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_query_sql"
expression = "Apache-2.0"
license-files = []
[[licenses.clarify]]
crate = "mentat_sql"
expression = "Apache-2.0"
license-files = []

[bans]
# The DD/timely pin and the vendored Mentat workspace drag in multiple versions
# and wildcard path deps transitively. Improv's own crates use pinned versions.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://codeberg.org/gregburd/mentat"]
