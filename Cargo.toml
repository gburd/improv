[workspace]
resolver = "2"
members = [
    "crates/core_model",
    "crates/data_source",
    "crates/storage_mentat",
    "crates/storage_sql",
    "crates/storage_csv",
    "crates/engine",
    "crates/cli",
    "crates/nl_formula",
    "crates/tui",
    "crates/server",
    "crates/gui",
    "crates/extfn",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
authors = ["Greg Burd <greg@burd.me>"]
repository = "https://github.com/gburd/improv"

[workspace.dependencies]
# Core deps shared across crates. Pinned; bump deliberately.
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# Differential dataflow is the mandated computation engine (see AGENT_STEERING.md).
# Version pinning is delicate: DD 0.13.7 pulls timely 0.19/timely_communication
# 0.18 (a columnar line that won't compile on rustc 1.97); DD 0.12.0 compiles but
# has a merge_batcher UB that aborts under debug assertions. DD 0.13.0 + timely
# 0.13.0 is the pre-breakage pair the spike validates.
differential-dataflow = "=0.13.0"
timely = "=0.13.0"
# Storage substrate: the embedded SQLite Mentat fork.
#
# A GIT dependency, not a path dependency: `path = "../mentat"` meant a fresh
# clone of this repo could not even parse its own manifest ("failed to read
# ../mentat/Cargo.toml"), so nobody outside this machine could build Improv. CI
# hid the breakage by cloning Mentat next to the checkout first.
#
# `rev` is pinned so builds are reproducible. Cargo forbids combining `branch`
# with `rev`, so the branch is recorded here instead: the revision below is the
# tip of `improv-base`. To take newer Mentat behavior, push to that branch and
# bump this `rev`.
mentat = { git = "https://codeberg.org/gregburd/mentat.git", rev = "eeaefafa13d4be27e8aa6208d7b50898a91205d0" }
# TUI (Phase 2).
ratatui = "0.29"
crossterm = "0.28"
# Server (Phase 3).
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.5"
# Desktop GUI (Phase 5). egui/eframe — see AGENT_GUI_STEERING §9.1.
# Pinned to the stable 0.29 API (0.36's `App::ui` API is newer/less settled).
eframe = "=0.29"
egui = "=0.29"
egui_extras = "=0.29"
